<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presenter · WebAuthn Algorithm Upgrades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/presenter.css">
</head>
<body>
  <div class="banner" hidden>
    Deck window not connected.
    <button class="open-deck">Open deck window</button>
  </div>

  <main class="grid">
    <section class="cur">
      <div class="label">Current <span class="title"></span></div>
      <div class="frame"><iframe class="cur-frame" title="Current slide" tabindex="-1"></iframe></div>
    </section>

    <aside class="side">
      <section class="nxt">
        <div class="label">After next press</div>
        <div class="frame"><iframe class="next-frame" title="Next step preview" tabindex="-1"></iframe><div class="end" hidden>End of deck</div></div>
      </section>
      <section class="meta">
        <div class="clocks">
          <button class="timer" title="Click to pause/resume">00:00</button>
          <button class="reset" title="Reset timer">↺</button>
          <span class="clock"></span>
        </div>
        <div class="pos"><span class="slide-n">–</span><span class="step-n"></span></div>
        <div class="dots" aria-label="Steps"></div>
      </section>
    </aside>

    <section class="notes">
      <div class="slide-notes"></div>
      <div class="step-notes"></div>
      <div class="next-notes"></div>
    </section>

    <footer class="controls">
      <button class="prev">◀ Prev</button>
      <button class="next">NEXT STEP ▶</button>
    </footer>
  </main>

  <script src="js/sync.js"></script>
  <script src="js/presenter.js"></script>
</body>
</html>
